name: Docs Lint

# Runs the yomiyasu Japanese prose linter on README-JP.md and docs/ja/.
# Kept separate from ci.yml on purpose: ci.yml lists '**.md' in paths-ignore
# so Rust CI skips doc-only PRs, which means a step added there would never run
# on the PRs this lint checks. Same pattern as claude-conventions.yml (#901 / #911).
#
# Fail-on-warn (#1165): every Japanese doc is clean, so the lint now blocks
# on warnings. The rules the lint approximates live in
# .claude/conventions/docs-structure.md -> "Japanese Writing Style"; that
# section wins when the two disagree.

concurrency:
  group: docs-lint-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    # Keep in sync with ci.yml on.push.branches.
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'        # Legacy: kept for backward compatibility
      - 'refactor/**'
      - 'doc/**'
      - 'docs/**'
      - 'hotfix/**'
    paths:
      - 'README-JP.md'
      - 'docs/ja/**'
      - '.yomiyasu-words/**'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'README-JP.md'
      - 'docs/ja/**'
      - '.yomiyasu-words/**'
      - '.github/workflows/docs-lint.yml'

permissions:
  contents: read

jobs:
  yomiyasu:
    name: Lint Japanese docs (yomiyasu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Third-party code is fetched here, never vendored. Pinned by full commit
      # SHA; keep the release tag comment in sync when bumping.
      - name: Check out yomiyasu
        uses: actions/checkout@v7.0.1
        with:
          repository: nanaism/yomiyasu
          ref: 028c9d3cd138be6d899b40e5d7c2f251cb15eb71 # v3.1.0
          path: .yomiyasu-tool
          persist-credentials: false

      # yomiyasu_lint.py uses the Python standard library only (3.9+).
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # Runs from the repository root: the script looks for .yomiyasu-words/ at
      # the git top level of the working directory, which is this repository.
      # --fail-on warn exits non-zero when any finding is reported; a non-zero
      # exit also covers tool-level failures (unreadable file or word list).
      - name: Run yomiyasu lint
        run: |
          shopt -s nullglob globstar
          status=0
          for file in README-JP.md docs/ja/**/*.md; do
            echo "::group::${file}"
            python .yomiyasu-tool/scripts/yomiyasu_lint.py --doc-type manual --fail-on warn "${file}" || status=$?
            echo "::endgroup::"
          done
          exit "${status}"
