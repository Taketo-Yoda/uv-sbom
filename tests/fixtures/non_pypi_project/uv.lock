version = 1
requires-python = ">=3.8"

[[package]]
name = "non-pypi-project"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "my-internal-lib" },
    { name = "standard-lib" },
    { name = "local-lib" },
    { name = "internal-workspace-pkg" },
]

[[package]]
name = "my-internal-lib"
version = "1.2.0"
source = { registry = "https://internal.company.com/simple" }

[[package]]
name = "standard-lib"
version = "2.5.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "dev-tool" },
    { name = "remote-archive" },
]

[[package]]
name = "dev-tool"
version = "0.1.0"
source = { git = "https://github.com/user/repo?rev=abc123" }

[[package]]
name = "remote-archive"
version = "3.0.0"
source = { url = "https://example.com/remote-archive-3.0.0-py3-none-any.whl" }

[[package]]
name = "local-lib"
version = "0.9.0"
source = { path = "vendor/local-lib" }

[[package]]
name = "internal-workspace-pkg"
version = "0.2.0"
source = { editable = "packages/internal-workspace-pkg" }
